name: Materialize Recurring Deposits

on:
  schedule:
    # 06:12 UTC, every day (deposits can be daily, unlike prices which only need weekdays).
    # Deliberately not on the hour — see refresh-prices.yml's cron comment
    # for why (GitHub deprioritizes top-of-the-hour scheduled runs).
    - cron: '12 6 * * *'
  workflow_dispatch:

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize due recurring deposits
        run: node scripts/materialize-deposits.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
