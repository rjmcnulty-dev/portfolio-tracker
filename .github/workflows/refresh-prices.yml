name: Refresh Stock Prices

on:
  schedule:
    # 21:00 UTC, weekdays — shortly after the US market close (4pm ET)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js requires native WebSocket (Node 22+); Node 20 throws at createClient().
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and store latest prices
        run: node scripts/fetch-prices.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
